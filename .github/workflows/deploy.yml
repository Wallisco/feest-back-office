name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: feest, POSTGRES_PASSWORD: feest, POSTGRES_DB: feest_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U feest" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://feest:feest@127.0.0.1:5432/feest_test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Deploy to the HostyAfrica server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /var/www/feest-backoffice/deploy.sh ${{ github.sha }}
