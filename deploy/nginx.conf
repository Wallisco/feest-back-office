# /etc/nginx/sites-available/feest-backoffice  (certbot adds the SSL lines)
# Sits next to the scoothero-backoffice site on the same server.
limit_req_zone $binary_remote_addr zone=feest_login:10m rate=10r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 10M;   # phone photos and signatures arrive as data URLs

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Login: rate-limited against password guessing
    location = /auth/login {
        limit_req zone=feest_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;   # PDF pack generation
    }
}
